[project]
name = "training-plan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "navneetpathak1", email = "navneetpathak1909@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.2",
    "greenlet>=3.5.6",
    "numpy>=2.5.4",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
training-plan = "training_plan:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
